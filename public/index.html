<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <!-- Fuente Atkinson Hyperlegible de Google Fonts (pesos normal y negrita) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>


 
  <div class="chat-lanzador" >
  <!-- 2. Bocadillo y botón flotante -->
    <!-- Bocadillo con "Kaixo" marcado como euskera -->
<button class="chat-bocadillo" id="chat-bocadillo"><span lang="eu">Kaixo!</span> ¡Hola! Soy <span class="nombre">Sare,</span> ¿necesitas ayuda?</button>
<!-- El alt describe la acción, no la imagen -->
<button class="chat-abrir" id="chat-abrir"><img src="assets/circulos.png" alt="Abrir el chat de ayuda"></button>  </div>

  <!-- 3. Ventana del chat (oculta al principio) -->
  <!-- Con hidden, la ventana empieza cerrada y el JS la abre -->
<section class="chat-ventana" id="chat-ventana" hidden>

    <!-- 3.1 Cabecera -->
    <header class="chat-cabecera">
      <span class="chat-avatar"></span>
      <button id="chat-cerrar" aria-label="Cerrar el chat">✕</button>
    </header>

    <!-- 3.2 Mensajes -->
    <div class="chat-mensajes" id="chat-mensajes" aria-live="polite">

      <div class="chat-saludo">
        <h2>Hola, soy Sare 👋</h2>
        <p>¿En qué puedo ayudarte?</p>
      </div>

      <div class="mensaje">
        <p>Soy Sare, tu asistente virtual y estoy aquí para lo que necesites.</p>
        <p>Por favor, no escribas ningún dato personal.</p>
      </div>

      <div class="mensaje">
        <p>Elige una opción o escribe tu pregunta.</p>
        <div class="chat-opciones">
          <button class="chat-opcion" data-pregunta="¿Qué cursos ofrece Saregune?">📚 Cursos</button>
          <button class="chat-opcion" data-pregunta="¿Cómo me puedo apuntar en un curso?">✍️ Inscripciones</button>
          <button class="chat-opcion" data-pregunta="¿Qué horarios hay?">🕒 Horarios</button>
          <button class="chat-opcion" data-pregunta="¿Cómo puedo contactar con Saregune?">📞 Contactar</button>
        </div>
      </div>

    </div>

    <!-- 3.3 Formulario -->
    <form id="chat-formulario" autocomplete="off">
      <input type="text" id="chat-entrada" placeholder="Escribe aquí tu mensaje" aria-label="Escribe tu mensaje" maxlength="500" required>
      <button type="submit">Enviar</button>
    </form>

    <!-- 3.4 Aviso final -->
    <p class="chat-aviso">
       Si necesitas ayuda, llámanos al 945 03 99 81 o pásate a vernos.
    </p>

  </section>

  <script src="front.js"></script>
</body>
</html>
