<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Conocimientos</title>
</head>
<body>

    <h1>Conocimientos CRUD</h1>

    <form action="/api/conocimientos" method="post" class="form-conocimiento">
        <input type="text" name="categoria" id="categoria" placeholder="Categoría">
        <input type="text" name="tipo" id="tipo" placeholder="Tipo">
        <input type="text" name="pregunta" id="pregunta" placeholder="Pregunta">
        <input type="text" name="respuesta" id="respuesta" placeholder="Respuesta">
        <input type="text" name="url" id="url" placeholder="URL">

        <input type="hidden" name="id" id="id">

        <button type="submit" class="btn-envio">Guardar</button>
    </form>

    <div class="lista-conocimientos">

        
    </div>

    <script src="admin.js"></script>
</body>
</html>
