<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="styles.css">
</head>
<body>

 
  <div class="chat-lanzador" >
  <!-- 2. Bocadillo y botón flotante -->
    <!-- Bocadillo con "Kaixo" marcado como euskera -->
<button class="chat-bocadillo" id="chat-bocadillo"><span lang="eu">Kaixo!</span> ¡Hola! Soy <span class="nombre">Sare,</span> ¿necesitas ayuda?</button>
<!-- El alt describe la acción, no la imagen -->
<button class="chat-abrir" id="chat-abrir"><img src="assets/circulos.png" alt="Abrir el chat de ayuda"></button>  </div>

<div class="chat-fondo" id="chat-fondo" hidden></div>

<!-- 3. Ventana del chat (oculta al principio) -->
  <!-- Con hidden, la ventana empieza cerrada y el JS la abre -->
<section class="chat-ventana" id="chat-ventana" role="dialog" aria-modal="true" aria-label="Chat de ayuda" hidden>

    <!-- 3.1 Cabecera -->
    <header class="chat-cabecera">
      <img src="assets/circulosblanco.png" alt="Logo de Saregune" class="chat-logo">
      <span class="chat-avatar"></span>
      <button id="chat-cerrar" aria-label="Cerrar el chat">✕</button>
    </header>

    <!-- 3.2 Mensajes -->
    <div class="chat-mensajes" id="chat-mensajes" aria-live="polite">

      <div class="chat-saludo">
        <h2>Hola, soy <span class="nombre">Sare</span> <i class="fa-solid fa-hands-clapping"></i></h2>
        <p>¿En qué puedo ayudarte?</p>
      </div>
      <div class="contenedor-mensaje">
        <img src="assets/circulos.png" alt="Logo de Saregune" class="chat-logo">
        <div class="mensaje">
          <p>Soy Sare, tu asistente virtual y estoy aquí para lo que necesites.</p>
          <p>Por favor, no escribas ningún dato personal.</p>
        </div>
      </div>
      
     

      <div class="mensaje">
        <p>Elige una opción o escribe tu pregunta.</p>
        <div class="chat-opciones">
          <button class="chat-opcion" data-pregunta="¿Qué cursos ofrece Saregune?">
            <span aria-hidden="true"><i class="fa-solid fa-book"></i></span>
            <span>Cursos</span>
          </button>
          <button class="chat-opcion" data-pregunta="¿Cómo me puedo apuntar en un curso?">
            <span aria-hidden="true"><i class="fa-solid fa-pen"></i></span> 
            <span>Inscripciones</span>
          </button>
          <button class="chat-opcion" data-pregunta="¿Qué horarios hay?">
            <span aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
            <span>Horarios</span>
          </button>
          <button class="chat-opcion" data-pregunta="¿Cómo puedo contactar con Saregune?">
            <span aria-hidden="true"><i class="fa-solid fa-phone"></i></span>
            <span>Contacto</span>
           
          </button>
           <br>
           <br>
          
        </div>
      </div>

    </div>

    <!-- 3.3 Formulario -->
    <form id="chat-formulario" autocomplete="off">
      <input type="text" id="chat-entrada" placeholder="Escribe aquí tu mensaje" aria-label="Escribe tu mensaje" maxlength="500" required>
      <button type="submit" aria-label="Enviar mensaje"><i class="fa-solid fa-paper-plane"></i></i></button>
    </form>

    <!-- 3.4 Aviso final -->
    <p class="chat-aviso">
       Sare es una IA y puede cometer errores. Por favor, contrasta la información importante.
    </p>

  </section>

  <script src="front.js"></script>
</body>
</html>
